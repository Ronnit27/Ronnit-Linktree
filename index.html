<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ronnit Suman | Links</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            background:
                radial-gradient(circle at top left, #833ab4, transparent 35%),
                radial-gradient(circle at bottom right, #fd1d1d, transparent 35%),
                linear-gradient(135deg, #1a1a1a, #000);

            color: white;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* Profile Photo */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            padding: 3px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .username {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .bio {
            color: #eee;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Social Buttons */
        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            width: 100%;
            padding: 16px;
            margin: 14px 0;

            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: bold;

            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 15px;

            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);

            transition: 0.3s ease;
        }

        .link:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .icon {
            font-size: 22px;
        }

        /* Instagram */
        .instagram:hover {
            background: linear-gradient(
                45deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5
            );
        }

        /* WhatsApp */
        .whatsapp:hover {
            background: #25D366;
        }

        /* Snapchat */
        .snapchat:hover {
            background: #fffc00;
            color: black;
        }

        /* Footer */
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }

        @media (max-width: 500px) {
            body {
                padding: 18px;
            }

            h1 {
                font-size: 23px;
            }

            .link {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Profile Picture -->
        <img
            src="WhatsApp Image 2026-09-19 at 5.51.59 PM.jpg"
            alt="Ronnit Suman"
            class="profile-img"
        >

        <!-- Name -->
        <h1>Ronnit Suman</h1>

        <!-- Instagram Username -->
        <div class="username">@ronnit_suman_27</div>

        <!-- Bio -->
        <p class="bio">
            ✨ Welcome to my world<br>
            📲 Connect with me
        </p>

        <!-- Instagram -->
        <a
            href="https://instagram.com/ronnit_suman_27"
            target="_blank"
            class="link instagram"
        >
            <span class="icon">📸</span>
            Instagram
        </a>

        <!-- WhatsApp -->
        <a
            href="https://wa.me/917808051287"
            target="_blank"
            class="link whatsapp"
        >
            <span class="icon">💬</span>
            WhatsApp
        </a>

        <!-- Snapchat -->
        <a
            href="https://www.snapchat.com/add/ronnit_27"
            target="_blank"
            class="link snapchat"
        >
            <span class="icon">👻</span>
            Snapchat
        </a>

        <!-- Footer -->
        <div class="footer">
            Made with ❤️ by Ronnit
        </div>

    </div>

</body>
</html>
